name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      # No version pin here: it comes from `packageManager` in
      # app/package.json, which Cloudflare's build image reads too — one
      # source of truth for the pnpm version across CI and deploys.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm build

      # Bundles the worker and resolves every binding in wrangler.jsonc
      # without touching the network. Config breakage otherwise surfaces only
      # in a Cloudflare build, whose log lives behind the dashboard.
      - run: npx wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
